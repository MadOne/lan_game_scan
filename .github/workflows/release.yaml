name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: |
          cargo binstall dioxus-cli@0.7.10 --no-confirm

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          dx --version

      - name: Check release build
        run: |
          cargo check --release

      - name: Bundle Linux packages
        run: |
          dx bundle --release \
            --package-types "appimage" \
            --package-types "deb" \
            --package-types "rpm"

      - name: Prepare release files
        run: |
          mkdir -p release

          cp target/dx/lan_game_scan/bundle/linux/appimage/*.AppImage release/
          cp target/dx/lan_game_scan/bundle/linux/deb/*.deb release/
          cp target/dx/lan_game_scan/bundle/linux/rpm/*.rpm release/

          ls -lh release

      - name: Generate SHA256 checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*