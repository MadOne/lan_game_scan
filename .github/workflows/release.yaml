name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:

  # ============================================================
  # Linux x86_64
  # ============================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            flatpak \
            flatpak-builder

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: |
          cargo binstall dioxus-cli@0.7.10 \
            --no-confirm \
            --disable-strategies compile

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          dx --version
          flatpak --version
          flatpak-builder --version

      - name: Bundle Linux packages
        run: |
          dx bundle --release \
            --package-types "appimage" \
            --package-types "deb" \
            --package-types "rpm"

      - name: Prepare Linux release files
        run: |
          mkdir -p release

          cp target/dx/lan_game_scan/bundle/linux/appimage/*.AppImage release/
          cp target/dx/lan_game_scan/bundle/linux/deb/*.deb release/
          cp target/dx/lan_game_scan/bundle/linux/rpm/*.rpm release/

      # --------------------------------------------------------
      # Flatpak
      # --------------------------------------------------------
      - name: Install GNOME Flatpak runtime
        run: |
          flatpak remote-add --if-not-exists \
            --user \
            flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          flatpak install --user --noninteractive \
            flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --repo=repo \
            --force-clean \
            build-dir \
            flatpak/com.madone.lan_game_scan.yml

      - name: Create Flatpak bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          flatpak build-bundle \
            repo \
            "release/LanGameScan_${VERSION}_x86_64.flatpak" \
            com.madone.lan_game_scan \
            master

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/


  # ============================================================
  # Windows x86_64
  # ============================================================
  windows:
    name: Windows x86_64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        shell: pwsh
        run: |
          cargo binstall dioxus-cli@0.7.10 `
            --no-confirm `
            --disable-strategies compile

      - name: Show tool versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          dx --version

      - name: Bundle Windows application
        shell: pwsh
        run: |
          dx bundle --release

      - name: Prepare Windows release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          New-Item -ItemType Directory -Force -Path portable

          # ----------------------------------------------------
          # Windows installer
          # ----------------------------------------------------
          $installer = Get-ChildItem `
            "target/dx/lan_game_scan/bundle/windows/nsis" `
            -Filter "*-setup.exe" `
            -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "Windows NSIS installer not found."
          }

          Copy-Item `
            $installer.FullName `
            "release/$($installer.Name)"

          # ----------------------------------------------------
          # Windows portable application
          # ----------------------------------------------------
          $app = "target/dx/lan_game_scan/release/windows/app"

          if (-not (Test-Path "$app/lan_game_scan.exe")) {
            throw "Portable executable not found: $app/lan_game_scan.exe"
          }

          if (-not (Test-Path "$app/assets")) {
            throw "Portable assets directory not found: $app/assets"
          }

          Copy-Item `
            "$app/lan_game_scan.exe" `
            "portable/"

          Copy-Item `
            "$app/assets" `
            "portable/assets" `
            -Recurse

          # ----------------------------------------------------
          # Portable ZIP
          # ----------------------------------------------------
          $version = "${{ github.ref_name }}".TrimStart("v")

          Compress-Archive `
            -Path "portable/*" `
            -DestinationPath "release/LanGameScan_${version}_x64-portable.zip" `
            -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: release/


  # ============================================================
  # Android ARM64
  # ============================================================
  android:
    name: Android ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------------
      # Android SDK
      # --------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

      # --------------------------------------------------------
      # Android environment
      # --------------------------------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # cargo-binstall
      # --------------------------------------------------------
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # --------------------------------------------------------
      # Dioxus CLI
      # --------------------------------------------------------
      - name: Install Dioxus CLI
        run: |
          cargo binstall dioxus-cli@0.7.10 \
            --no-confirm \
            --disable-strategies compile

      # --------------------------------------------------------
      # Configure Android linker
      # --------------------------------------------------------
      - name: Configure Android linker
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          LINKER="$TOOLCHAIN/bin/aarch64-linux-android35-clang"

          echo "Android toolchain:"
          echo "$TOOLCHAIN"

          echo "Android linker:"
          echo "$LINKER"

          if [ ! -x "$LINKER" ]; then
            echo
            echo "ERROR: Android linker not found."
            echo
            echo "Available Android ARM64 linkers:"
            ls -la "$TOOLCHAIN/bin/" | grep aarch64-linux-android || true
            exit 1
          fi

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$LINKER"
          EOF

          echo
          echo "Cargo configuration:"
          cat .cargo/config.toml

      # --------------------------------------------------------
      # Verify Android toolchain
      # --------------------------------------------------------
      - name: Verify Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo
          echo "Rust targets:"
          rustup target list --installed

          echo
          echo "Android ARM64 linker:"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" --version

          echo
          echo "Cargo linker configuration:"
          cat .cargo/config.toml

      # --------------------------------------------------------
      # Tool versions
      # --------------------------------------------------------
      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          dx --version

      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------
      - name: Build Android ARM64 APK
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          dx build \
            --android \
            --release \
            --target aarch64-linux-android

      # --------------------------------------------------------
      # Find APK
      # --------------------------------------------------------
      - name: Find Android APK
        run: |
          echo "Android build output:"

          find target/dx -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # --------------------------------------------------------
      # Verify APK
      # --------------------------------------------------------
      - name: Verify Android APK
        run: |
          APK=$(find target/dx -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

          echo
          echo "APK information:"

          "$ANDROID_HOME/build-tools/35.0.1/aapt" \
            dump badging "$APK" |
            head -10

          echo
          echo "Native libraries:"

          unzip -l "$APK" |
            grep -E 'lib/.*/libmain.so'

          echo
          echo "Checking for ARM64 library:"

          if ! unzip -l "$APK" |
            grep -q 'lib/arm64-v8a/libmain.so'; then

            echo "ERROR: APK does not contain arm64-v8a/libmain.so"
            exit 1
          fi

          echo
          echo "ARM64 APK verification successful."

      # --------------------------------------------------------
      # Prepare release artifact
      # --------------------------------------------------------
      - name: Prepare Android release file
        run: |
          mkdir -p release

          APK=$(find target/dx -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"

          cp "$APK" \
            "release/LanGameScan_${VERSION}_android_arm64.apk"

          ls -lh release/

      # --------------------------------------------------------
      # Upload Android artifact
      # --------------------------------------------------------
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: release/


  # ============================================================
  # GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04

    needs:
      - linux
      - windows
      - android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Download Linux artifacts
      # --------------------------------------------------------
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: release

      # --------------------------------------------------------
      # Download Windows artifacts
      # --------------------------------------------------------
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: release

      # --------------------------------------------------------
      # Download Android artifacts
      # --------------------------------------------------------
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-arm64
          path: release

      # --------------------------------------------------------
      # Show final release files
      # --------------------------------------------------------
      - name: Show release files
        run: |
          echo "Release files:"
          ls -lh release/

      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/* \
            --title "${{ github.ref_name }}" \
            --generate-notes