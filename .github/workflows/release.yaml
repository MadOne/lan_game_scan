name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: |
          cargo binstall dioxus-cli@0.7.10 --no-confirm

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          dx --version

      - name: Bundle Linux packages
        run: |
          dx bundle --release \
            --package-types "appimage" \
            --package-types "deb" \
            --package-types "rpm"

      - name: Prepare Linux release files
        run: |
          mkdir -p release

          cp target/dx/lan_game_scan/bundle/linux/appimage/*.AppImage release/
          cp target/dx/lan_game_scan/bundle/linux/deb/*.deb release/
          cp target/dx/lan_game_scan/bundle/linux/rpm/*.rpm release/

          ls -lh release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/


  windows:
    name: Windows x86_64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        shell: pwsh
        run: |
          cargo binstall dioxus-cli@0.7.10 --no-confirm

      - name: Show tool versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          dx --version

      - name: Bundle Windows application
        shell: pwsh
        run: |
          dx bundle --release

      - name: Show complete Windows bundle structure
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " COMPLETE target/dx DIRECTORY STRUCTURE"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem `
            -Path target/dx `
            -Recurse `
            -Force |
            Select-Object `
              FullName,
              Mode,
              Length,
              LastWriteTime |
            Format-Table -AutoSize

      - name: Show Windows bundle directories
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " DIRECTORIES"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem `
            -Path target/dx `
            -Recurse `
            -Directory |
            Select-Object FullName |
            Format-Table -AutoSize

      - name: Show Windows files with sizes
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " FILES + SIZES"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem `
            -Path target/dx `
            -Recurse `
            -File |
            Sort-Object Length -Descending |
            Select-Object `
              FullName,
              @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      - name: Find Windows executables
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " EXECUTABLES"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem `
            -Path target/dx `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in ".exe", ".dll"
            } |
            Select-Object `
              FullName,
              @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      - name: Find web assets
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " WEB / DIOXUS ASSETS"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem `
            -Path target/dx `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in `
                ".css", `
                ".js", `
                ".html", `
                ".ico", `
                ".png", `
                ".jpg", `
                ".jpeg", `
                ".svg", `
                ".webp", `
                ".json"
            } |
            Select-Object `
              FullName,
              @{Name="SizeKB";Expression={[math]::Round($_.Length / 1KB, 2)}} |
            Format-Table -AutoSize

      - name: Upload complete Windows bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-inspection
          path: target/dx/