name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            flatpak \
            flatpak-builder

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: |
          cargo binstall dioxus-cli@0.7.10 \
            --no-confirm \
            --disable-strategies compile

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          dx --version
          flatpak --version
          flatpak-builder --version

      - name: Bundle Linux packages
        run: |
          dx bundle --release \
            --package-types "appimage" \
            --package-types "deb" \
            --package-types "rpm"

      - name: Prepare Linux release files
        run: |
          mkdir -p release

          cp target/dx/lan_game_scan/bundle/linux/appimage/*.AppImage release/
          cp target/dx/lan_game_scan/bundle/linux/deb/*.deb release/
          cp target/dx/lan_game_scan/bundle/linux/rpm/*.rpm release/

      - name: Install GNOME Flatpak runtime
        run: |
          flatpak remote-add --if-not-exists \
            --user \
            flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          flatpak install --user --noninteractive \
            flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --repo=repo \
            --force-clean \
            build-dir \
            flatpak/com.madone.lan_game_scan.yml

      - name: Create Flatpak bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          flatpak build-bundle \
            repo \
            "release/LanGameScan_${VERSION}_x86_64.flatpak" \
            com.madone.lan_game_scan \
            master

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/


  windows:
    name: Windows x86_64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        shell: pwsh
        run: |
          cargo binstall dioxus-cli@0.7.10 `
            --no-confirm `
            --disable-strategies compile

      - name: Show tool versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          dx --version

      - name: Bundle Windows application
        shell: pwsh
        run: |
          dx bundle --release

      - name: Prepare Windows release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          New-Item -ItemType Directory -Force -Path portable

          # Installer
          $installer = Get-ChildItem `
            "target/dx/lan_game_scan/bundle/windows/nsis" `
            -Filter "*-setup.exe" `
            -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "Windows NSIS installer not found."
          }

          Copy-Item `
            $installer.FullName `
            "release/$($installer.Name)"

          # Portable application
          $app = "target/dx/lan_game_scan/release/windows/app"

          if (-not (Test-Path "$app/lan_game_scan.exe")) {
            throw "Portable executable not found: $app/lan_game_scan.exe"
          }

          if (-not (Test-Path "$app/assets")) {
            throw "Portable assets directory not found: $app/assets"
          }

          Copy-Item `
            "$app/lan_game_scan.exe" `
            "portable/"

          Copy-Item `
            "$app/assets" `
            "portable/assets" `
            -Recurse

          # Portable ZIP
          $version = "${{ github.ref_name }}".TrimStart("v")

          Compress-Archive `
            -Path "portable/*" `
            -DestinationPath "release/LanGameScan_${version}_x64-portable.zip" `
            -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: release/


  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04

    needs:
      - linux
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: release

      - name: Show release files
        run: |
          echo "Release files:"
          ls -lh release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
