
[package]
name = "lan_scanner"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    ".",
    "live_log",
    "cbz_rcon",
]



[dependencies]
# This allows you to define versions once for the whole project
dioxus = { version = "0.7.10", features = ["desktop", "router"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
surge-ping = "0.9.0"
directories = "6.0.0"
#rusqlite = "0.40.1"
enum_stringify = "0.6.5"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
#gamedig = "0.9.0"
serde_json = "1.0.151"
regex = "1.13.1"
image = "0.25.10"
live_log = { path = "live_log"}
cbz_rcon = { path = "cbz_rcon"}
if-addrs = "0.15.0"
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
